[package]
name = "ctf-rust"
authors = ["Daniel Pyon <pyondohyun@gmail.com>"]
edition = "2021"
publish = false

[package.metadata.docs.rs]
targets = ["thumbv7em-none-eabihf"]

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.5", features = ["set-sp", "set-vtor"] }
embedded-hal-nb = "1.0.0"
embedded-io = "0.6.1"
max7800x-hal = "0.6.0"
panic-halt = "1.0.0"
rand = { version = "0.8.5", default-features = false }
bincode = { version = "2.0.0-rc.3", default-features = false, features = ["derive", "serde"] }

# Uncomment if you want to use semihosting
# cortex-m-semihosting = "0.5"
